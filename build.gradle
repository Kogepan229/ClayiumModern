plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
    id 'com.diffplug.spotless' version '8.1.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()

    // LDLib2 and its bundled Taffy dependency.
    maven {
        name = 'FirstDark snapshots'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib2'
            includeGroup 'dev.vfyjxf'
        }
    }

    // REI, Cloth Config, and Architectury.
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }

    // JEI.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }

    // Jade.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.client

    runs {
        client {
            client()
            sourceSet = sourceSets.client
            gameDirectory = project.file('run/client')

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            sourceSet = sourceSets.client

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

// Client-only development dependencies must not leak into the dedicated-server
// runtime classpath or published metadata.
configurations {
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
    clientAnnotationProcessor.extendsFrom annotationProcessor
}

dependencies {
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version_line}:${ldlib2_version}")

    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    switch (runtime_itemlist_mod) {
        case 'rei':
            clientRuntimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
            break
        case 'jei':
            clientRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
            break
        case 'none':
            break
        default:
            throw new GradleException("Unknown runtime_itemlist_mod: ${runtime_itemlist_mod}")
    }

    compileOnly("maven.modrinth:jade:${jade_version}")
    clientRuntimeOnly("maven.modrinth:jade:${jade_version}")

    compileOnly("org.projectlombok:lombok:${lombok_version}")
    annotationProcessor("org.projectlombok:lombok:${lombok_version}")

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testRuntimeOnly("com.mojang:datafixerupper:${datafixerupper_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ldlib2_version_range   : ldlib2_version_range,
                             rei_version_range      : rei_version_range,
                             jei_version_range      : jei_version_range,
                             jade_version_range     : jade_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from(sourceSets.client.output)
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/client/java/**/*.java'

        toggleOffOn()
        importOrderFile(file("$rootDir/spotless/spotless.importorder"))
        removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
        endWithNewline()
        eclipse('4.38').configFile(file("$rootDir/spotless/spotless.eclipseformat.xml"))
    }
}
