name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag commit is on main
        run: |
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="$RELEASE_TAG"
          if [ -z "$release_version" ]; then
            echo "The release tag must contain a version." >&2
            exit 1
          fi
          echo "value=$release_version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        env:
          MOD_VERSION: ${{ steps.release_version.outputs.value }}
        run: ./gradlew build "-Pmod_version=$MOD_VERSION"

      - name: Publish GitHub release
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          files: 'build/libs/!(*-@(dev|sources|javadoc)).jar'
          version: ${{ steps.release_version.outputs.value }}
